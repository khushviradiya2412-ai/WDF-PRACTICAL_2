<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Student Hub - Register</title>
  </head>
  <body>
    <center>
      <h1>REGISTER PAGE</h1>
      <form>
        FULL NAME :
        <input id="fullname" name="fullname" type="text" placeholder="Enter full name" required><br><br>
        
        Username :
        <input id="username" name="username" type="text" placeholder="Enter username" required /><br /><br />

        Email :
        <input id="email" name="email" type="email" placeholder="Enter email" required /><br /><br />

        Phone Number :
        <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required /><br /><br />

        Password :
        <input id="password" name="password" type="password" placeholder="Enter password" required /><br /><br />

        confirm password :
        <input id="confirm" name="confirm" type="password" placeholder="Confirm password" required/><br /><br />

        <input type="submit" value="Submit" />
        <input type="reset" value="Clear" />

        <br /><br />
        <a href="../HOME.HTML">Back to Home</a>
        <br />
      </form>
      <br />
      <hr />
      <footer>
        <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
      </footer>
    </center>
  </body>
</html>
